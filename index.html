<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyBrain</title>
<meta name="description" content="Personal tasks and notes">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f1f1ee;
    --text: #1c1c1a; --muted: #6f6f6a; --faint: #a3a39d;
    --border: #e7e7e2; --accent: #1f7a5a; --accent-soft: #e6f2ec;
    --danger: #c43d3d; --danger-soft: #fbeaea; --warn: #b7791f;
    --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1c1c1c; --surface-2: #262626;
      --text: #ececea; --muted: #9a9a95; --faint: #6b6b66;
      --border: #2c2c2c; --accent: #4cc496; --accent-soft: #1b2e26;
      --danger: #ef6b6b; --danger-soft: #3a1f1f; --warn: #e0a84a;
      --shadow: none; color-scheme: dark;
    }
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
         padding-bottom: calc(72px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .hidden { display: none !important; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  header { padding: calc(18px + env(safe-area-inset-top)) 0 8px; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
              display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .icon-btn:active { background: var(--surface-2); }
  section { padding-top: 8px; }

  /* ---------- Controls ---------- */
  .field { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
           padding: 12px 14px; outline: none; transition: border-color .15s; }
  .field:focus { border-color: var(--accent); }
  textarea.field { min-height: 150px; resize: vertical; line-height: 1.55; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px;
         border-radius: 10px; border: 1px solid transparent; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-secondary { background: var(--surface); border-color: var(--border); }
  .btn-danger { background: var(--surface); border-color: var(--border); color: var(--danger); }
  .btn:disabled { opacity: .5; }
  .btn-row { display: flex; gap: 10px; margin-top: 12px; }
  .btn-row .btn { flex: 1; }
  .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; }

  /* ---------- Search + segmented ---------- */
  .search { position: relative; margin: 6px 0 12px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 18px; height: 18px; }
  .search input { padding-left: 38px; height: 42px; }
  .seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-bottom: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; height: 32px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  /* ---------- Grouped list ---------- */
  .group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  .item { display: flex; gap: 12px; padding: 12px 14px; align-items: flex-start; border-top: 1px solid var(--border); }
  .item:first-child { border-top: 0; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-weight: 500; word-wrap: break-word; }
  .item.done .item-title { color: var(--faint); text-decoration: line-through; }
  .item-body { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: pre-wrap; word-wrap: break-word; }
  .note .item-body { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .note.open .item-body { -webkit-line-clamp: unset; display: block; }
  .note .item-main { cursor: pointer; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--surface-2); font-size: 12px; color: var(--muted); }
  .chip svg { width: 13px; height: 13px; }
  .chip.overdue { background: var(--danger-soft); color: var(--danger); }
  .chip.today { background: var(--accent-soft); color: var(--accent); }
  .chip.high { color: var(--danger); background: var(--danger-soft); }
  .chip.kind { cursor: pointer; border: 1px solid var(--border); background: var(--surface); }
  .del { border: 0; background: transparent; color: var(--faint); padding: 2px; cursor: pointer; border-radius: 6px; }
  .del:active { color: var(--danger); }
  .del.armed { color: var(--danger); background: var(--danger-soft); }

  /* Round checkbox */
  .check { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 1px 0 0; border: 2px solid var(--faint);
           border-radius: 50%; cursor: pointer; flex: none; display: grid; place-items: center; transition: all .15s; }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .check.prio-1 { border-color: var(--danger); }
  .check.square { border-radius: 6px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty svg { width: 36px; height: 36px; color: var(--faint); margin-bottom: 8px; }
  .notice { font-size: 13px; color: var(--muted); padding: 10px 12px; background: var(--surface-2); border-radius: 10px; margin: 14px 0 10px; white-space: pre-wrap; }
  .notice.warn { color: var(--warn); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }

  /* ---------- Bottom tab bar ---------- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent);
             backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border);
             padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.tabs .inner { max-width: 640px; margin: 0 auto; display: flex; }
  nav.tabs button { flex: 1; border: 0; background: transparent; padding: 9px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
                    font-size: 11px; font-weight: 600; color: var(--faint); cursor: pointer; position: relative; }
  nav.tabs button.on { color: var(--text); }
  .badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
           background: var(--danger); color: #fff; font-size: 10px; line-height: 17px; }

  /* ---------- Toast ---------- */
  #toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
           box-shadow: 0 6px 20px rgba(0,0,0,.15); z-index: 20; max-width: 90vw; }

  /* ---------- Login ---------- */
  .login { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; max-width: 380px; margin: 0 auto; }
  .login img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 18px; }
  .login .field { margin-top: 10px; }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<div class="wrap">
  <header id="header" class="hidden">
    <div class="head-row">
      <div><h1 id="title">Inbox</h1><div class="sub" id="subtitle"></div></div>
      <button id="btnSettings" class="icon-btn" aria-label="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <!-- LOGIN -->
  <section id="viewLogin" class="login hidden">
    <img src="icons/icon-192.png" alt="">
    <h1>MyBrain</h1>
    <div class="sub">Your private tasks and notes.</div>
    <input id="email" class="field" type="email" placeholder="Email" autocomplete="email" style="margin-top:22px">
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password">
    <div class="btn-row">
      <button id="btnLogin" class="btn btn-primary">Log in</button>
      <button id="btnSignup" class="btn btn-secondary">Sign up</button>
    </div>
  </section>

  <!-- CAPTURE -->
  <section id="viewCapture" class="hidden">
    <textarea id="rough" class="field" placeholder="Write anything — tasks, ideas, reminders. Mix languages freely.&#10;&#10;Example: call electrician tomorrow, idea: group-balanced negatives for SSL, buy milk"></textarea>
    <div class="btn-row">
      <button id="btnOrganize" class="btn btn-primary"><svg class="i"><use href="#i-spark"/></svg><span>Organize</span></button>
      <button id="btnQuick" class="btn btn-secondary">Save as note</button>
    </div>
    <div id="previewWrap" class="hidden">
      <div id="source" class="notice"></div>
      <div id="preview" class="group"></div>
      <div class="btn-row">
        <button id="btnSavePreview" class="btn btn-primary">Save</button>
        <button id="btnCancelPreview" class="btn btn-secondary">Discard</button>
      </div>
    </div>
  </section>

  <!-- LIST -->
  <section id="viewList" class="hidden">
    <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" class="field" placeholder="Search"></div>
    <div class="seg" id="seg">
      <button data-f="open" class="on">Open</button>
      <button data-f="done">Completed</button>
      <button data-f="all">All</button>
    </div>
    <div id="list"></div>
  </section>

  <!-- SETTINGS -->
  <section id="viewSettings" class="hidden">
    <div class="label">AI</div>
    <div class="group" style="padding:14px">
      <div class="sub" style="margin:0 0 6px">Provider</div>
      <div class="seg" id="provSeg">
        <button data-p="groq">Groq · Qwen</button>
        <button data-p="gemini">Google · Gemini</button>
      </div>
      <div class="sub" id="keyHint" style="margin:12px 0 6px"></div>
      <input id="aiKey" class="field" type="password" placeholder="Paste API key" autocomplete="off">
      <div class="sub" style="margin:12px 0 6px">Model</div>
      <input id="aiModel" class="field" autocomplete="off">
      <div class="btn-row">
        <button id="btnSaveSettings" class="btn btn-primary">Save</button>
        <button id="btnTestAI" class="btn btn-secondary">Test connection</button>
      </div>
      <div id="aiTestOut" class="notice mono hidden"></div>
    </div>

    <div class="label">Data</div>
    <div class="group" style="padding:14px">
      <div class="sub" style="margin:0 0 10px">Download everything as a JSON file. Keep it in Google Drive, not GitHub.</div>
      <button id="btnExport" class="btn btn-secondary" style="width:100%"><svg class="i"><use href="#i-download"/></svg>Export backup</button>
    </div>

    <div class="label">Account</div>
    <div class="group" style="padding:14px">
      <div class="sub" id="whoami" style="margin:0 0 10px"></div>
      <button id="btnLogout" class="btn btn-danger" style="width:100%">Log out</button>
    </div>
  </section>
</div>

<nav class="tabs hidden" id="nav">
  <div class="inner">
    <button data-view="capture" class="on"><svg class="i"><use href="#i-inbox"/></svg>Capture</button>
    <button data-view="todo"><svg class="i"><use href="#i-check"/></svg>Tasks<span class="badge hidden" id="badge"></span></button>
    <button data-view="note"><svg class="i"><use href="#i-note"/></svg>Notes</button>
  </div>
</nav>

<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============ 1. CONFIG ============
// The publishable key is meant to be public. Row Level Security keeps your data private.
const SUPABASE_URL = "https://yncbwqhytcxkqrlonkkk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Sf-aeTSLVtF1aR2-KUSWMA_ecVQidxd";
// AI providers. Keys live only in this browser (localStorage), never in the repo.
const PROVIDERS = {
  groq:   { label: "Groq", defaultModel: "qwen/qwen3-32b", hint: "Groq API key (starts with gsk_) · free at console.groq.com · stored only on this device" },
  gemini: { label: "Gemini", defaultModel: "gemini-3.5-flash-lite", hint: "Gemini API key · free at aistudio.google.com · stored only on this device" },
};
const DEBUG = true; // set false to silence console logs

// ============ 2. STATE ============
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const state = { prov: "groq", user: null, items: [], view: "capture", preview: [], source: "", filter: "open", openNote: null };
const $ = (id) => document.getElementById(id);
const log = (...a) => DEBUG && console.log("[MyBrain]", ...a);
const icon = (name) => `<svg class="i"><use href="#i-${name}"/></svg>`;
const TITLES = { capture: "Capture", todo: "Tasks", note: "Notes", settings: "Settings" };

// ============ 3. BOOT ============
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch((e) => log("sw failed", e));
boot();

async function boot() {
  migrateOldKeys();
  fillSettings(aiCfg().provider);
  wireEvents();
  const { data } = await db.auth.getSession();
  state.user = data.session?.user || null;
  log("session user", state.user?.email);
  if (state.user) { await loadItems(); show("capture"); } else { show("login"); }
}

// ============ 4. EVENTS ============
function wireEvents() {
  $("btnLogin").onclick = () => auth("login");
  $("btnSignup").onclick = () => auth("signup");
  $("password").onkeydown = (e) => e.key === "Enter" && auth("login");
  $("btnLogout").onclick = async () => { await db.auth.signOut(); state.user = null; state.items = []; show("login"); };
  $("btnSettings").onclick = () => show(state.view === "settings" ? "capture" : "settings");
  $("btnSaveSettings").onclick = () => { saveSettings(); toast(`Saved · using ${PROVIDERS[state.prov].label}`); };
  document.querySelectorAll("#provSeg button").forEach((b) => (b.onclick = () => fillSettings(b.dataset.p)));
  $("btnTestAI").onclick = testAI;
  $("btnExport").onclick = exportBackup;
  $("btnOrganize").onclick = organize;
  $("btnQuick").onclick = quickNote;
  $("btnSavePreview").onclick = savePreview;
  $("btnCancelPreview").onclick = clearPreview;
  $("search").oninput = renderList;
  document.querySelectorAll("#seg button").forEach((b) => (b.onclick = () => {
    state.filter = b.dataset.f;
    document.querySelectorAll("#seg button").forEach((x) => x.classList.toggle("on", x === b));
    renderList();
  }));
  document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => show(b.dataset.view)));
}

// ============ 5. VIEWS ============
function show(view) {
  state.view = view;
  const loggedIn = view !== "login";
  $("header").classList.toggle("hidden", !loggedIn);
  $("nav").classList.toggle("hidden", !loggedIn);
  $("viewLogin").classList.toggle("hidden", view !== "login");
  $("viewCapture").classList.toggle("hidden", view !== "capture");
  $("viewList").classList.toggle("hidden", view !== "todo" && view !== "note");
  $("viewSettings").classList.toggle("hidden", view !== "settings");
  $("seg").classList.toggle("hidden", view !== "todo");
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === view));
  if (!loggedIn) return;
  $("title").textContent = TITLES[view];
  $("whoami").textContent = "Signed in as " + (state.user?.email || "");
  $("search").value = "";
  updateHeader();
  if (view === "todo" || view === "note") renderList();
}

function updateHeader() {
  const today = iso(new Date());
  const open = state.items.filter((i) => i.kind === "todo" && !i.done);
  const dueNow = open.filter((i) => i.due && i.due <= today).length;
  const notes = state.items.filter((i) => i.kind === "note").length;
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const sub = { capture: dateStr, todo: `${open.length} open · ${dueNow} due today or overdue`, note: `${notes} notes`, settings: "" };
  $("subtitle").textContent = sub[state.view] || "";
  $("badge").textContent = dueNow;
  $("badge").classList.toggle("hidden", !dueNow);
}

function toast(msg, ms = 2200) {
  const t = $("toast");
  t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), ms);
}

function busy(btn, on) {
  btn.disabled = on;
  if (on) { btn.dataset.html = btn.innerHTML; btn.innerHTML = `<span class="spinner"></span>`; }
  else if (btn.dataset.html) btn.innerHTML = btn.dataset.html;
}

// ============ 6. AUTH ============
async function auth(mode) {
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || password.length < 6) return toast("Enter email and a password of 6+ characters");
  const btn = mode === "signup" ? $("btnSignup") : $("btnLogin");
  busy(btn, true);
  const fn = mode === "signup" ? db.auth.signUp : db.auth.signInWithPassword;
  const { data, error } = await fn.call(db.auth, { email, password });
  busy(btn, false);
  log("auth", mode, data, error);
  if (error) return toast(error.message, 4000);
  if (!data.session) return toast("Check your email to confirm, then log in", 5000);
  state.user = data.user;
  await loadItems();
  show("capture");
}

// ============ 7. DATA (Supabase) ============
async function loadItems() {
  const { data, error } = await db.from("items").select("*").order("created_at", { ascending: false });
  log("loadItems", data?.length, error);
  if (error) return toast("Could not load: " + error.message, 4000);
  state.items = data;
}

async function insertItems(rows) {
  const { data, error } = await db.from("items").insert(rows).select();
  log("insertItems", rows, data, error);
  if (error) { toast("Could not save: " + error.message, 4000); return false; }
  state.items = [...data, ...state.items];
  updateHeader();
  return true;
}

async function updateItem(id, patch) {
  patch.updated_at = new Date().toISOString();
  const { error } = await db.from("items").update(patch).eq("id", id);
  log("updateItem", id, patch, error);
  if (error) return toast("Could not update: " + error.message, 4000);
  Object.assign(state.items.find((i) => i.id === id), patch);
  updateHeader();
  setTimeout(renderList, patch.done ? 350 : 0); // short pause so the tick is visible
}

async function deleteItem(id, btn) {
  if (confirmDelete.armed !== id) { // first tap arms, second tap deletes
    document.querySelectorAll(".del.armed").forEach((b) => b.classList.remove("armed"));
    confirmDelete.armed = id; btn.classList.add("armed"); return toast("Tap again to delete");
  }
  confirmDelete.armed = null;
  const { error } = await db.from("items").delete().eq("id", id);
  log("deleteItem", id, error);
  if (error) return toast("Could not delete: " + error.message, 4000);
  state.items = state.items.filter((i) => i.id !== id);
  updateHeader(); renderList(); toast("Deleted");
}
const confirmDelete = { armed: null };

// ============ 8. AI SETTINGS ============
function aiCfg(p = localStorage.getItem("aiProvider") || "groq") {
  return { provider: p, key: localStorage.getItem("key_" + p) || "", model: localStorage.getItem("model_" + p) || PROVIDERS[p].defaultModel };
}

// One-time move of the old Gemini-only settings into the new per-provider slots
function migrateOldKeys() {
  const k = localStorage.getItem("geminiKey"), m = localStorage.getItem("geminiModel");
  if (k && !localStorage.getItem("key_gemini")) localStorage.setItem("key_gemini", k);
  if (m && !localStorage.getItem("model_gemini")) localStorage.setItem("model_gemini", m);
}

function fillSettings(p) {
  state.prov = p;
  const cfg = aiCfg(p);
  document.querySelectorAll("#provSeg button").forEach((b) => b.classList.toggle("on", b.dataset.p === p));
  $("keyHint").textContent = PROVIDERS[p].hint;
  $("aiKey").value = cfg.key;
  $("aiModel").value = cfg.model;
  $("aiModel").placeholder = PROVIDERS[p].defaultModel;
  $("aiTestOut").classList.add("hidden");
}

function saveSettings() {
  const p = state.prov;
  localStorage.setItem("aiProvider", p);
  localStorage.setItem("key_" + p, $("aiKey").value.trim());
  localStorage.setItem("model_" + p, $("aiModel").value.trim() || PROVIDERS[p].defaultModel);
}

// ============ 9. ORGANIZE (AI → fallback) ============
async function organize() {
  const text = $("rough").value.trim();
  if (!text) return toast("Write something first");
  const cfg = aiCfg();
  let items = null, source = "", warn = false;
  busy($("btnOrganize"), true);
  if (!cfg.key) { source = `No ${PROVIDERS[cfg.provider].label} key saved, so the basic parser was used. Add a key in Settings.`; warn = true; }
  else {
    try { items = await aiOrganize(text, cfg); source = `Organized with ${cfg.model}. Review, then save.`; }
    catch (e) { log("AI failed", e); source = `AI failed (${e.message}). Used the basic parser instead.`; warn = true; }
  }
  busy($("btnOrganize"), false);
  if (!items) items = offlineOrganize(text);
  state.preview = items.map((i) => ({ ...i, keep: true }));
  state.source = source;
  $("source").classList.toggle("warn", warn);
  renderPreview();
}

// Settings → Test connection: checks key, lists models, fixes model name if needed, makes one real call
async function testAI() {
  const out = $("aiTestOut");
  out.classList.remove("hidden");
  saveSettings();
  const cfg = aiCfg(state.prov);
  if (!cfg.key) return (out.textContent = "Paste your key first.");
  out.textContent = "Checking key…";
  let names = [];
  try {
    names = cfg.provider === "groq" ? await listGroqModels(cfg.key) : await listGeminiModels(cfg.key);
    if (!names.length) throw new Error("Key works, but no suitable text model found.");
    let model = cfg.model;
    if (!names.includes(model)) {
      const prefer = cfg.provider === "groq"
        ? ["qwen/qwen3-32b", "llama-3.3-70b-versatile", "openai/gpt-oss-20b"]
        : ["gemini-3.5-flash-lite", "gemini-flash-lite-latest"];
      model = prefer.find((n) => names.includes(n)) || names.find((n) => /qwen|flash-lite/.test(n)) || names[0];
      $("aiModel").value = model;
      localStorage.setItem("model_" + cfg.provider, model);
    }
    out.textContent = `Key OK · model: ${model}\nTest call running…`;
    const t0 = Date.now();
    const items = await aiOrganize("kal college me HOD meeting, idea: try mixup negatives", { ...cfg, model });
    out.textContent = `✓ Connected · ${model} · ${((Date.now() - t0) / 1000).toFixed(1)}s\n\nTest result:\n` +
      items.map((i) => `• [${i.kind}] ${i.title}${i.due ? " · " + i.due : ""}`).join("\n") +
      `\n\nOther models: ${names.slice(0, 12).join(", ")}`;
  } catch (e) {
    out.textContent = "✕ " + e.message + (names.length ? `\n\nModels on your account: ${names.join(", ")}` : "");
  }
}

async function listGroqModels(key) {
  const res = await fetch("https://api.groq.com/openai/v1/models", { headers: { Authorization: "Bearer " + key } });
  const json = await res.json();
  log("groq models", json);
  if (!res.ok) throw new Error(json.error?.message || "HTTP " + res.status);
  return (json.data || []).map((m) => m.id).filter((n) => !/whisper|guard|tts|orpheus|playai|distil|compound/i.test(n)).sort();
}

async function listGeminiModels(key) {
  const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", { headers: { "x-goog-api-key": key } });
  const json = await res.json();
  log("gemini models", json);
  if (!res.ok) throw new Error(json.error?.message || "HTTP " + res.status);
  return (json.models || [])
    .filter((m) => (m.supportedGenerationMethods || []).includes("generateContent"))
    .map((m) => m.name.replace("models/", ""))
    .filter((n) => /flash/.test(n) && !/image|tts|audio|live|exp|preview/.test(n));
}

// ============ 10. AI CALL ============
function buildPrompt(text) {
  const now = new Date(), tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  return `Today is ${weekday}, ${iso(now)}. Split the rough text into separate items.
Each item is a "todo" (an action the user must do) or a "note" (idea, info, thought).
Rules:
- title: short, clear, in English, max 80 chars. Translate Hinglish/Gujarati. Fix spelling. Keep names and acronyms (GTU, HOD, SSL).
- body: extra details only, else "".
- tags: 1-3 lowercase single-word tags (work, college, teaching, research, home, family, money, health).
- due: YYYY-MM-DD only if a day/date is mentioned ("kal"=tomorrow, "aaj"=today, "parso"=day after tomorrow), else null.
- priority: 1 if urgent/important, 3 if "someday/maybe", else 2.
Output ONLY JSON: {"items":[{"kind":"todo|note","title":"","body":"","tags":[],"due":null,"priority":2}]}

Example input: kal 10 baje HOD meeting, idea: mixup for SSL negatives
Example output: {"items":[{"kind":"todo","title":"Meeting with HOD at 10 AM","body":"","tags":["college"],"due":"${iso(tmr)}","priority":2},{"kind":"note","title":"Use mixup for SSL negatives","body":"","tags":["research"],"due":null,"priority":2}]}

Input: ${text}
Output:`;
}

async function aiOrganize(text, cfg) {
  const prompt = buildPrompt(text);
  const raw = cfg.provider === "gemini" ? await callGemini(prompt, cfg) : await callGroq(prompt, cfg);
  log("ai raw text", raw);
  return parseItems(raw);
}

async function callGroq(prompt, cfg, noReasoningFlag = false) {
  const body = {
    model: cfg.model,
    messages: [{ role: "system", content: "You turn messy notes into clean JSON. Reply with JSON only." }, { role: "user", content: prompt }],
    temperature: 0.2,
    response_format: { type: "json_object" },
  };
  if (!noReasoningFlag && /qwen3/i.test(cfg.model)) body.reasoning_effort = "none"; // skip slow "thinking" mode
  if (!noReasoningFlag && /gpt-oss/i.test(cfg.model)) body.reasoning_effort = "low";
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    signal: AbortSignal.timeout(25000),
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.key },
    body: JSON.stringify(body),
  });
  const json = await res.json();
  log("groq raw", json);
  if (!res.ok) {
    const msg = json.error?.message || "HTTP " + res.status;
    if (body.reasoning_effort && /reasoning/i.test(msg)) return callGroq(prompt, cfg, true); // model doesn't support the flag
    throw new Error(msg);
  }
  return json.choices[0].message.content;
}

async function callGemini(prompt, cfg) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent`, {
    method: "POST",
    signal: AbortSignal.timeout(25000),
    headers: { "Content-Type": "application/json", "x-goog-api-key": cfg.key },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: "application/json", temperature: 0.2 },
    }),
  });
  const json = await res.json();
  log("gemini raw", json);
  if (!res.ok) throw new Error(json.error?.message || "HTTP " + res.status);
  return json.candidates[0].content.parts[0].text;
}

// Accepts messy model output: strips <think> blocks and code fences, finds the JSON,
// then finds the list of items whatever key the model used ("items", "tasks", "result"...).
function parseItems(raw) {
  const snippet = String(raw || "").slice(0, 300) || "(empty reply)";
  const clean = String(raw || "").replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/```(json)?/gi, "");
  const o = clean.indexOf("{"), l = clean.indexOf("[");
  const isArr = l >= 0 && (o < 0 || l < o); // bare list vs object
  const a = isArr ? l : o, b = clean.lastIndexOf(isArr ? "]" : "}");
  if (a < 0 || b < a) throw new Error("Model did not return JSON.\nReply was: " + snippet);
  let out;
  try { out = JSON.parse(clean.slice(a, b + 1)); } catch (e) { throw new Error("Bad JSON from model.\nReply was: " + snippet); }
  const items = findItemList(out).map(cleanItem).filter((i) => i.title !== "(untitled)");
  if (!items.length) throw new Error("Model returned no items.\nReply was: " + snippet);
  return items;
}

function findItemList(x) {
  if (Array.isArray(x)) {
    if (x.some((v) => v && typeof v === "object" && ("title" in v || "kind" in v))) return x;
    return x.flatMap((v) => (v && typeof v === "object" ? findItemList(v) : []));
  }
  if (x && typeof x === "object") {
    if ("title" in x) return [x]; // a single item
    const lists = Object.entries(x).map(([k, v]) => {
      const found = findItemList(v);
      // {"todos":[...], "notes":[...]} → use the key as the kind when missing
      const kind = /todo|task/i.test(k) ? "todo" : /note|idea/i.test(k) ? "note" : null;
      return found.map((it) => (kind && !it.kind ? { ...it, kind } : it));
    });
    return lists.flat();
  }
  return [];
}

// Offline: one item per line/comma-chunk, simple keyword rules
function offlineOrganize(text) {
  const verbs = /^(call|buy|send|pay|email|mail|book|fix|submit|upload|finish|check|meet|ask|prepare|make|write|read|go|todo|remind|complete)\b/i;
  const chunks = text.split(/\n|;|,(?=\s*[a-z])/i).map((s) => s.replace(/^[-*•\d.)\s]+/, "").trim()).filter(Boolean);
  return chunks.map((c) => {
    const isTodo = verbs.test(c) || /\b(todo|tmrw|tomorrow|today|kal|aaj|karna|lena|by \w+day)\b/i.test(c);
    const isIdea = /^(idea|note)\s*:/i.test(c);
    return cleanItem({
      kind: isTodo && !isIdea ? "todo" : "note",
      title: c.replace(/^(idea|note|todo)\s*:\s*/i, ""),
      due: guessDate(c),
      tags: [],
      priority: /\b(urgent|asap|important)\b/i.test(c) ? 1 : 2,
    });
  });
}

function guessDate(s) {
  const d = new Date();
  if (/\b(today|aaj)\b/i.test(s)) return iso(d);
  if (/\b(tmrw|tomorrow|kal)\b/i.test(s)) { d.setDate(d.getDate() + 1); return iso(d); }
  const days = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const m = s.toLowerCase().match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/);
  if (m) { const t = days.findIndex((x) => x.startsWith(m[1])); d.setDate(d.getDate() + ((t - d.getDay() + 7) % 7 || 7)); return iso(d); }
  return null;
}
const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); // local date, not UTC

function cleanItem(i) {
  return {
    kind: i.kind === "todo" ? "todo" : "note",
    title: String(i.title || "").slice(0, 200) || "(untitled)",
    body: String(i.body || ""),
    tags: Array.isArray(i.tags) ? i.tags.slice(0, 5).map(String) : [],
    due: /^\d{4}-\d{2}-\d{2}$/.test(i.due) ? i.due : null,
    priority: [1, 2, 3].includes(Number(i.priority)) ? Number(i.priority) : 2,
  };
}

// ============ 11. PREVIEW ============
function renderPreview() {
  $("previewWrap").classList.toggle("hidden", !state.preview.length);
  $("source").textContent = state.source;
  $("preview").innerHTML = state.preview.map((p, n) => `
    <div class="item">
      <input type="checkbox" class="check square" data-n="${n}" ${p.keep ? "checked" : ""} aria-label="Include">
      <div class="item-main">
        <div class="item-title">${esc(p.title)}</div>
        ${p.body ? `<div class="item-body">${esc(p.body)}</div>` : ""}
        <div class="meta">
          <span class="chip kind" data-flip="${n}">${icon(p.kind === "todo" ? "check" : "note")}${p.kind === "todo" ? "Task" : "Note"}</span>
          ${metaChips(p)}
        </div>
      </div>
    </div>`).join("");
  $("preview").querySelectorAll("[data-n]").forEach((c) => (c.onchange = () => (state.preview[c.dataset.n].keep = c.checked)));
  $("preview").querySelectorAll("[data-flip]").forEach((b) => (b.onclick = () => {
    const p = state.preview[b.dataset.flip]; p.kind = p.kind === "todo" ? "note" : "todo"; renderPreview();
  }));
}

async function savePreview() {
  const rows = state.preview.filter((p) => p.keep).map(({ keep, ...r }) => r);
  if (!rows.length) return toast("Nothing selected");
  busy($("btnSavePreview"), true);
  const ok = await insertItems(rows);
  busy($("btnSavePreview"), false);
  if (ok) { toast(`Saved ${rows.length} item${rows.length > 1 ? "s" : ""}`); $("rough").value = ""; clearPreview(); }
}

function clearPreview() { state.preview = []; renderPreview(); }

async function quickNote() {
  const text = $("rough").value.trim();
  if (!text) return toast("Write something first");
  const [first, ...rest] = text.split("\n");
  if (await insertItems([cleanItem({ kind: "note", title: first, body: rest.join("\n") })])) { $("rough").value = ""; toast("Note saved"); }
}

// ============ 12. LIST ============
function renderList() {
  const kind = state.view, q = $("search").value.toLowerCase(), f = state.filter;
  let rows = state.items.filter((i) => i.kind === kind);
  if (q) rows = rows.filter((i) => (i.title + " " + i.body + " " + (i.tags || []).join(" ")).toLowerCase().includes(q));

  if (kind === "note") {
    $("list").innerHTML = rows.length ? `<div class="group">${rows.map(itemHtml).join("")}</div>` : emptyHtml("note", q ? "No matching notes" : "No notes yet");
  } else {
    if (f === "open") rows = rows.filter((i) => !i.done);
    if (f === "done") rows = rows.filter((i) => i.done);
    rows.sort((a, b) => (a.done - b.done) || String(a.due || "9999").localeCompare(String(b.due || "9999")) || (a.priority - b.priority));
    const today = iso(new Date());
    const groups = [
      ["Overdue", rows.filter((i) => !i.done && i.due && i.due < today)],
      ["Today", rows.filter((i) => !i.done && i.due === today)],
      ["Upcoming", rows.filter((i) => !i.done && i.due && i.due > today)],
      ["No date", rows.filter((i) => !i.done && !i.due)],
      ["Completed", rows.filter((i) => i.done)],
    ].filter(([, g]) => g.length);
    $("list").innerHTML = groups.length
      ? groups.map(([name, g]) => `<div class="label">${name} · ${g.length}</div><div class="group">${g.map(itemHtml).join("")}</div>`).join("")
      : emptyHtml("check", q ? "No matching tasks" : f === "done" ? "Nothing completed yet" : "All clear");
  }
  $("list").querySelectorAll("[data-done]").forEach((c) => (c.onchange = () => updateItem(c.dataset.done, { done: c.checked })));
  $("list").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => deleteItem(b.dataset.del, b)));
  $("list").querySelectorAll("[data-open]").forEach((el) => (el.onclick = () => el.closest(".note").classList.toggle("open")));
}

function itemHtml(i) {
  const isTodo = i.kind === "todo";
  return `<div class="item ${isTodo ? "" : "note"} ${i.done ? "done" : ""}">
    ${isTodo ? `<input type="checkbox" class="check prio-${i.priority}" data-done="${i.id}" ${i.done ? "checked" : ""} aria-label="Done">` : ""}
    <div class="item-main" ${isTodo ? "" : "data-open"}>
      <div class="item-title">${esc(i.title)}</div>
      ${i.body ? `<div class="item-body">${esc(i.body)}</div>` : ""}
      <div class="meta">${metaChips(i)}${isTodo ? "" : `<span>${relDate(i.created_at)}</span>`}</div>
    </div>
    <button class="del" data-del="${i.id}" aria-label="Delete">${icon("trash")}</button>
  </div>`;
}

function metaChips(i) {
  const today = iso(new Date());
  let html = "";
  if (i.due) {
    const cls = !i.done && i.due < today ? "overdue" : i.due === today ? "today" : "";
    html += `<span class="chip ${cls}">${icon("cal")}${dueLabel(i.due)}</span>`;
  }
  if (i.priority === 1) html += `<span class="chip high">${icon("flag")}High</span>`;
  (i.tags || []).forEach((t) => (html += `<span class="chip">${icon("tag")}${esc(t)}</span>`));
  return html;
}

function dueLabel(d) {
  const today = new Date(iso(new Date())), due = new Date(d);
  const diff = Math.round((due - today) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  if (diff > 1 && diff < 7) return due.toLocaleDateString(undefined, { weekday: "short" });
  return due.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

function relDate(ts) {
  const d = new Date(ts), mins = (Date.now() - d) / 60000;
  if (mins < 1) return "Just now";
  if (mins < 60) return `${Math.floor(mins)}m ago`;
  if (mins < 1440) return `${Math.floor(mins / 60)}h ago`;
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

function emptyHtml(ic, text) {
  return `<div class="empty"><svg class="i"><use href="#i-${ic}"/></svg><div>${text}</div></div>`;
}

// ============ 13. BACKUP ============
function exportBackup() {
  const blob = new Blob([JSON.stringify(state.items, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mybrain-backup-${iso(new Date())}.json`;
  a.click();
  toast(`Exported ${state.items.length} items`);
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
